[project]
name = "cats-vs-mutants"
version = "0.1.0"
description = "A small lane defense game with ASCII graphics for the terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cats-vs-mutants = "cats_vs_mutants.ui.main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cats_vs_mutants"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
