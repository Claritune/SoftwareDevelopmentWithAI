[project]
name = "url-monitor"
version = "1.0.0"
description = "CLI tool that monitors URLs for uptime and logs state transitions"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
url-monitor = "url_monitor.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
