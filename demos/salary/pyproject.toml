[project]
name = "salary"
version = "0.1.0"
description = "Hilanet hours report -> payroll calculation -> salary slip, with a LangChain/OpenAI review agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
